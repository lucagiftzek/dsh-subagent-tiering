# Mount subagent tiering with its built-in rules (src/rules.js). The profile's own
# cordis.patch.yml may override with a "- id: subagent-tiering" row.
- insert:
    - id: subagent-tiering
      name: '@lucagiftzek/dsh-subagent-tiering'
      config:
        enabled: true
